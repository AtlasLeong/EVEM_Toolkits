name: CI

on:
  push:
    branches: [master, codex/automated-deployment]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  market_mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.37
        env:
          MYSQL_DATABASE: market_ci
          MYSQL_USER: market_ci
          MYSQL_PASSWORD: market-ci-temporary-only
          MYSQL_ROOT_PASSWORD: market-ci-root-temporary-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MARKET_CI_MYSQL: '1'
      MARKET_CI_DB_PASSWORD: market-ci-temporary-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install isolated Market test dependencies
        run: python -m pip install -r scripts/deploy/requirements-ci.txt -r scripts/deploy/requirements-market.txt mysqlclient==2.2.0
      - name: Migrate and exercise disposable MySQL 8 Market schema
        working-directory: backend
        run: |
          set -euo pipefail
          python manage.py check --settings=EVE_MDjango.market_mysql_ci_settings
          python manage.py migrate --database=default --noinput --settings=EVE_MDjango.market_mysql_ci_settings
          DJANGO_SETTINGS_MODULE=EVE_MDjango.market_mysql_ci_settings python -m unittest EVE_MDjango.tests_market_mysql_integration -v

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      action: ${{ steps.plan.outputs.action }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Prepare isolated check evidence
        run: mkdir -p ci-evidence
      - name: Release safety tests
        run: python -m unittest discover -s scripts/deploy/tests -v 2>&1 | tee ci-evidence/release-tests.log
      - name: Community QA tool safety tests (no database or credentials)
        run: python -m unittest discover -s scripts/community/tests -v 2>&1 | tee ci-evidence/community-safety-tests.log
      - name: Install isolated backend test dependencies
        run: python -m pip install -r scripts/deploy/requirements-ci.txt -r backend/requirements-tactical.txt -r scripts/deploy/requirements-market.txt
      - name: Tactical fixture safety tests (no remote access)
        run: python -m unittest discover -s scripts/tactical/tests -v 2>&1 | tee ci-evidence/tactical-safety-tests.log
      - name: Public access, account verification and refresh-token policy (isolated)
        working-directory: backend
        run: |
          python manage.py test Authentication.test_viewer_access Authentication.test_public_auth Authentication.tests --settings=EVE_MDjango.public_auth_test_settings --noinput 2>&1 | tee ../ci-evidence/auth-policy-tests.log
          python manage.py test Authentication.test_public_read_access --settings=EVE_MDjango.public_access_test_settings --noinput 2>&1 | tee ../ci-evidence/public-read-tests.log
          python manage.py test FraudList --settings=EVE_MDjango.fraud_access_test_settings --noinput 2>&1 | tee ../ci-evidence/fraud-access-tests.log
      - name: License, activation, feedback, community and deployment-version tests (isolated SQLite)
        working-directory: backend
        run: |
          python manage.py test TacticalBoard License ActivationCode Feedback Community Starsea EVE_MDjango.tests_deployment --settings=EVE_MDjango.ci_settings --noinput 2>&1 | tee ../ci-evidence/backend-tests.log
          python manage.py makemigrations Feedback Community Starsea --check --dry-run --settings=EVE_MDjango.ci_settings 2>&1 | tee ../ci-evidence/migration-check.log
      - name: Tactical authorization, presence and transport tests (isolated SQLite)
        working-directory: backend
        run: |
          python manage.py test TacticalCollaboration tests_tactical_transport tests_tactical_local tests_tactical_universe --settings=EVE_MDjango.ci_settings --noinput 2>&1 | tee ../ci-evidence/tactical-backend-tests.log
          python manage.py makemigrations TacticalCollaboration --check --dry-run --settings=EVE_MDjango.ci_settings 2>&1 | tee ../ci-evidence/tactical-migration-check.log
      - name: Market price and collection tests (isolated SQLite)
        working-directory: backend
        run: |
          python manage.py test Market GameSessions.tests EVE_MDjango.tests_market_worker_settings EVE_MDjango.tests_market_mysql_ci_settings EVE_MDjango.tests_market_rehearsal_settings --settings=EVE_MDjango.ci_settings --noinput 2>&1 | tee ../ci-evidence/market-backend-tests.log
          python manage.py makemigrations Market --check --dry-run --settings=EVE_MDjango.ci_settings 2>&1 | tee ../ci-evidence/market-migration-check.log
      - name: Install frontend dependencies
        working-directory: front-codex
        run: npm ci --no-audit --no-fund
      - name: Private Killboard and shared game catalog regression
        working-directory: backend
        run: |
          python manage.py test Killboard.tests.test_api Killboard.tests.test_diagnostics Killboard.tests.test_serializers Killboard.tests.test_models Killboard.tests.test_parser Killboard.tests.test_services Killboard.tests.test_discovery Killboard.tests.test_freshness Killboard.tests.test_bootstrap Killboard.tests.test_catalog Killboard.tests.test_asset_registry Killboard.tests.test_image_catalog Killboard.tests.test_security Killboard.tests.test_collector_transport Killboard.tests.test_session_bundle Killboard.tests.test_identity_protocol Killboard.tests.test_worker Killboard.tests.test_worker_settings GameData.tests --settings=EVE_MDjango.killboard_test_settings --noinput 2>&1 | tee ../ci-evidence/killboard-tests.log
          python manage.py makemigrations Killboard --check --dry-run --settings=EVE_MDjango.killboard_test_settings
      - name: Private capture tooling and game data provenance tests
        run: |
          python -m pip install -r scripts/killboard/requirements-tools.txt
          python -m pip install -r scripts/game_data/client_assets/requirements.txt
          python -m unittest discover -s scripts/killboard/tests -v
          python -m unittest discover -s scripts/game_data/tests -v
          python -m unittest discover -s scripts/game_data/client_assets/tests -v
      - name: Frontend dependencies ready
        working-directory: front-codex
        run: node --version
      - name: Install test browser
        working-directory: front-codex
        run: npx playwright install --with-deps chromium
      - name: Frontend unit and local preview contract tests
        working-directory: front-codex
        run: node --test tests/unit/*.test.mjs tests/preview/*.test.mjs 2>&1 | tee ../ci-evidence/frontend-unit-preview.log
      - name: Build frontend
        working-directory: front-codex
        run: npm run build 2>&1 | tee ../ci-evidence/frontend-build.log
      - name: Enforce frontend bundle budget
        working-directory: front-codex
        run: npm run check:bundle 2>&1 | tee ../ci-evidence/frontend-bundle-budget.log
      - name: Full frontend regression suite
        working-directory: front-codex
        run: npm run test:e2e 2>&1 | tee ../ci-evidence/frontend-e2e.log
      - name: Interactive local preview workflow (independent configuration)
        working-directory: front-codex
        run: npx playwright test --config tests/preview-e2e/playwright.config.js 2>&1 | tee ../ci-evidence/preview-e2e.log
      - name: Tactical frontend workflow (mock API, not backend security proof)
        working-directory: front-codex
        run: npx playwright test --config tests/tactical-e2e/playwright.config.js 2>&1 | tee ../ci-evidence/tactical-e2e.log
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            front-codex/playwright-report
            front-codex/test-results
            front-codex/test-results-tactical
            front-codex/output/preview-sandbox-tests
            ci-evidence
          retention-days: 7
          if-no-files-found: ignore
      - name: Plan publishable source changes
        id: plan
        env:
          EVEM_RELEASE_SHA: ${{ github.sha }}
          EVEM_PLAN_PATH: release-plan.json
        run: |
          python scripts/deploy/source_plan.py --output release-plan.json
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "scripts/deploy"))
          from transfer import inspect_source

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("duplicate release-plan key")
                  result[key] = value
              return result

          plan = json.loads(Path(os.environ["EVEM_PLAN_PATH"]).read_text(encoding="utf-8"), object_pairs_hook=unique)
          if not isinstance(plan, dict) or type(plan.get("format")) is not int or plan["format"] != 1:
              raise SystemExit("unsupported release plan")
          if plan.get("action") not in ("noop", "release") or plan.get("sha") != os.environ["EVEM_RELEASE_SHA"]:
              raise SystemExit("release-plan action or SHA mismatch")
          baseline, inputs = plan.get("baseline"), plan.get("inputs")
          components = {"frontend", "backend"}
          if not isinstance(baseline, dict) or set(baseline) not in (set(), components) or any(not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) for value in baseline.values()):
              raise SystemExit("invalid release-plan baseline")
          if not isinstance(inputs, dict) or set(inputs) != components:
              raise SystemExit("invalid release-plan inputs")
          for evidence in inputs.values():
              if not isinstance(evidence, dict) or set(evidence) != {"head", "baseline"} or not isinstance(evidence["head"], str) or not re.fullmatch(r"[0-9a-f]{64}", evidence["head"]) or (evidence["baseline"] is not None and (not isinstance(evidence["baseline"], str) or not re.fullmatch(r"[0-9a-f]{64}", evidence["baseline"]))):
                  raise SystemExit("invalid release-plan fingerprint")
          inspect_source(plan, os.environ["EVEM_RELEASE_SHA"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"action={plan['action']}\n")
          PY
      - name: Keep verified release plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep verified frontend build for packaging
        if: steps.plan.outputs.action == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: front-codex/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Artifacts for production are available only after every independent CI gate.
  package:
    needs: [validate, market_mysql]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Read the plan from this verification attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-plan-${{ github.sha }}-${{ github.run_attempt }}
      - name: Validate verified plan
        id: plan
        env:
          EVEM_RELEASE_SHA: ${{ github.sha }}
          EVEM_PLAN_PATH: release-plan.json
          EVEM_EXPECTED_ACTION: ${{ needs.validate.outputs.action }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "scripts/deploy"))
          from transfer import inspect_source

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("duplicate release-plan key")
                  result[key] = value
              return result

          plan = json.loads(Path(os.environ["EVEM_PLAN_PATH"]).read_text(encoding="utf-8"), object_pairs_hook=unique)
          if not isinstance(plan, dict) or type(plan.get("format")) is not int or plan["format"] != 1:
              raise SystemExit("unsupported release plan")
          if plan.get("action") not in ("noop", "release") or plan.get("sha") != os.environ["EVEM_RELEASE_SHA"]:
              raise SystemExit("release-plan action or SHA mismatch")
          if plan["action"] != os.environ["EVEM_EXPECTED_ACTION"]:
              raise SystemExit("verification output and release plan differ")
          baseline, inputs = plan.get("baseline"), plan.get("inputs")
          components = {"frontend", "backend"}
          if not isinstance(baseline, dict) or set(baseline) not in (set(), components) or any(not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) for value in baseline.values()):
              raise SystemExit("invalid release-plan baseline")
          if not isinstance(inputs, dict) or set(inputs) != components:
              raise SystemExit("invalid release-plan inputs")
          for evidence in inputs.values():
              if not isinstance(evidence, dict) or set(evidence) != {"head", "baseline"} or not isinstance(evidence["head"], str) or not re.fullmatch(r"[0-9a-f]{64}", evidence["head"]) or (evidence["baseline"] is not None and (not isinstance(evidence["baseline"], str) or not re.fullmatch(r"[0-9a-f]{64}", evidence["baseline"]))):
                  raise SystemExit("invalid release-plan fingerprint")
          inspect_source(plan, os.environ["EVEM_RELEASE_SHA"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"action={plan['action']}\n")
          PY
      - name: Keep publishable release plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Download verified frontend build
        if: steps.plan.outputs.action == 'release'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: front-codex/dist
      - name: Package verified commit
        if: steps.plan.outputs.action == 'release'
        run: python scripts/deploy/pack.py
      - name: Keep publishable release
        if: steps.plan.outputs.action == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release.tar.gz
            release-manifest.json
          if-no-files-found: error
          retention-days: 14
