name: CI

on:
  push:
    branches: [codex/automated-deployment]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Release safety tests
        run: python -m unittest discover -s scripts/deploy/tests -v
      - name: Install isolated backend test dependencies
        run: python -m pip install -r scripts/deploy/requirements-ci.txt
      - name: License, activation and deployment-version tests (isolated SQLite)
        working-directory: backend
        run: python manage.py test License ActivationCode EVE_MDjango.tests_deployment --settings=EVE_MDjango.ci_settings --noinput
      - name: Install frontend dependencies
        working-directory: front-codex
        run: npm ci --no-audit --no-fund
      - name: Install test browser
        working-directory: front-codex
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: front-codex
        run: npm run build
      - name: Full frontend regression suite
        working-directory: front-codex
        run: npm run test:e2e
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            front-codex/playwright-report
            front-codex/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Package verified commit
        run: python scripts/deploy/pack.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 14
